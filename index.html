<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yaoka.works</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1d1b;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .portal {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 380px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 28px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            background: #2b2926;
            border: 2px solid #3d3a35;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            text-align: center;
        }
        .btn:hover {
            transform: translateY(-3px);
            background: #35322e;
            border-color: #81B64C;
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <main class="portal">
        <a class="btn" href="public/index.html">📚 Giữa kì LTW</a>
        <a class="btn" href="chess/index.html">♟ Khai cuộc cờ vua</a>
    </main>
</body>
</html>
