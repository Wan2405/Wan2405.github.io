<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
  <title>Biểu mẫu gửi về đâu?</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(20px,8vh,80px) 16px; background: #f3f6f5; color: #183a38; font: 16px/1.55 "Segoe UI", sans-serif; }
    main { max-width: 540px; margin: auto; padding: clamp(20px,5vw,36px); background: white; border: 1px solid #d3dfdc; border-radius: 16px; }
    h1 { margin: 0 0 8px; font-size: clamp(24px,6vw,32px); line-height: 1.2; }
    p { margin: 0 0 22px; }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend, .field, .result-label { display: block; font-weight: 600; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 18px; }
    .choices label { padding: 6px 12px; border: 1px solid #c2d3ce; border-radius: 8px; cursor: pointer; }
    .choices label:has(:checked) { background: #e5f5ee; border-color: #42816f; }
    input[type=radio] { accent-color: #216a58; }
    input[type=password] { width: 100%; padding: 10px; margin: 6px 0 18px; border: 1px solid #cad5d2; border-radius: 6px; font: inherit; background: #f8faf9; }
    .result { padding: 12px 16px; border-left: 3px solid #33846d; background: #eef7f2; }
    output { display: block; overflow-wrap: anywhere; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Biểu mẫu gửi về đâu?</h1>
    <p>Chọn một đích gửi, rồi bấm <strong>Kiểm tra biểu mẫu</strong> trong extension để đối chiếu.</p>
    <fieldset>
      <legend>Đích gửi của form</legend>
      <div class="choices">
        <label><input type="radio" name="mode" value="same" checked> Cùng tên miền</label>
        <label><input type="radio" name="mode" value="other"> Khác tên miền</label>
      </div>
    </fieldset>
    <form id="demo" action="./demo-login">
      <label class="field" for="sample">Ô mật khẩu mẫu</label>
      <input id="sample" type="password" readonly placeholder="Ô chỉ đọc, không cần nhập">
    </form>
    <div class="result">
      <span class="result-label">Địa chỉ form khai báo sẽ gửi đến</span>
      <output id="destination" aria-live="polite"></output>
    </div>
  </main>
  <script>
    const form = document.querySelector("#demo");
    const destination = document.querySelector("#destination");
    const otherHost = /(^|\.)example\.net\.?$/i.test(location.hostname) ? "example.org" : "example.net";

    function updateDestination() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      form.setAttribute("action", mode === "same" ? "./demo-login" : "https://" + otherHost + "/verify");
      destination.textContent = form.action;
    }

    document.querySelector("fieldset").addEventListener("change", updateDestination);
    form.addEventListener("submit", event => event.preventDefault());
    updateDestination();
  </script>
</body>
</html>
