openapi: 3.0.3
info:
  title: ReadOwl Library REST API — Integrated
  version: 1.2.0
  description: Integrated PHP API contract after both repair stages. All SQL DATETIME/DATE values use Asia/Ho_Chi_Minh
    (+07:00); health.timestamp includes its offset. JWT uses HS256 and server checks the current user role/status
    in DB. JSON write requests require application/json and a top-level object. Query parameters must be scalar
    UTF-8 values. Errors use the Error schema. No ETag/If-None-Match or 304 caching feature is implemented in this
    version. Two library screens fetch successive pages of up to 50 books; the API itself remains paginated. Legacy
    modules not called by api/index.php are not API entry points.
servers:
- url: http://localhost:8000/api/v1
  description: PHP built-in server
- url: http://localhost/LTW-GK/api/v1
  description: Example Apache subfolder; adjust LTW-GK to the installed project directory.
tags:
- name: Health
- name: Auth
- name: Users
- name: Loans
- name: Categories
- name: Books
- name: Statistics
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
        is_active:
          type: integer
          enum:
          - 0
          - 1
        created_at:
          type: string
          example: '2026-10-19 16:00:00'
      required:
      - id
      - full_name
      - email
      - role
      - is_active
      - created_at
    RegisteredUser:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
        is_active:
          type: integer
          enum:
          - 0
          - 1
      required:
      - id
      - full_name
      - email
      - role
      - is_active
    UserListItem:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
        is_active:
          type: integer
          enum:
          - 0
          - 1
        created_at:
          type: string
          example: '2026-10-19 16:00:00'
        borrowed_count:
          type: integer
        pending_count:
          type: integer
        overdue_count:
          type: integer
    UserDetail:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
        is_active:
          type: integer
          enum:
          - 0
          - 1
        created_at:
          type: string
          example: '2026-10-19 16:00:00'
        loan_stats:
          $ref: '#/components/schemas/LoanSummary'
        recent_loans:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              book_id:
                type: integer
              book_title:
                type: string
                nullable: true
              book_author:
                type: string
                nullable: true
              status:
                type: string
                enum:
                - pending
                - borrowed
                - returned
                - rejected
                - cancelled
              is_overdue:
                type: boolean
              requested_at:
                type: string
              borrowed_at:
                type: string
                nullable: true
              due_date:
                type: string
                format: date
                nullable: true
              returned_at:
                type: string
                nullable: true
              rejection_reason:
                type: string
                nullable: true
    Loan:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        user_is_active:
          type: integer
          enum:
          - 0
          - 1
          nullable: true
        book_id:
          type: integer
        book_title:
          type: string
          nullable: true
        book_author:
          type: string
          nullable: true
        book_cover:
          type: string
          nullable: true
        book_available_copies:
          type: integer
          nullable: true
        book_total_copies:
          type: integer
          nullable: true
        category_name:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending
          - borrowed
          - returned
          - rejected
          - cancelled
        is_overdue:
          type: boolean
        is_returned_late:
          type: boolean
        requested_at:
          type: string
        borrowed_at:
          type: string
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        returned_at:
          type: string
          nullable: true
        approved_by:
          type: integer
          nullable: true
        approved_by_name:
          type: string
          nullable: true
        returned_by:
          type: integer
          nullable: true
        returned_by_name:
          type: string
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActionLink'
        category_id:
          type: integer
          nullable: true
      required:
      - id
      - user_id
      - user_name
      - user_email
      - user_is_active
      - book_id
      - book_title
      - book_author
      - book_cover
      - book_available_copies
      - book_total_copies
      - category_name
      - status
      - is_overdue
      - is_returned_late
      - requested_at
      - borrowed_at
      - due_date
      - returned_at
      - approved_by
      - approved_by_name
      - returned_by
      - returned_by_name
      - rejection_reason
      - links
    LoanSummary:
      type: object
      properties:
        total_loans:
          type: integer
        pending_count:
          type: integer
        borrowed_count:
          type: integer
        overdue_count:
          type: integer
        returned_count:
          type: integer
        rejected_count:
          type: integer
        cancelled_count:
          type: integer
    ActionLink:
      type: object
      properties:
        href:
          type: string
        method:
          type: string
          enum:
          - GET
          - PATCH
        body:
          type: object
          additionalProperties: true
      required:
      - href
      - method
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required:
          - code
          - message
      required:
      - success
      - error
    UserMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        summary:
          type: object
          properties:
            total_members:
              type: integer
            active_members:
              type: integer
            locked_members:
              type: integer
    LoanMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        summary:
          $ref: '#/components/schemas/LoanSummary'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
      - page
      - limit
      - total
      - total_pages
    Category:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
          nullable: true
        book_count:
          type: integer
          minimum: 0
        active_book_count:
          type: integer
          minimum: 0
        created_at:
          type: string
      required:
      - id
      - name
      - description
      - book_count
      - active_book_count
      - created_at
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
      required:
      - name
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
    Book:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1
        category_name:
          type: string
        isbn:
          type: string
          nullable: true
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
          nullable: true
        publish_year:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        cover_path:
          type: string
          nullable: true
        total_copies:
          type: integer
          minimum: 0
        available_copies:
          type: integer
          minimum: 0
        borrowed_copies:
          type: integer
          minimum: 0
        is_available:
          type: boolean
        is_active:
          type: integer
          enum:
          - 0
          - 1
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - category_id
      - category_name
      - isbn
      - title
      - author
      - publisher
      - publish_year
      - description
      - cover_path
      - total_copies
      - available_copies
      - borrowed_copies
      - is_available
      - is_active
      - created_at
      - updated_at
    BookInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 200
        category_id:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 4294967295
          - type: string
            pattern: ^\s*[0-9]+\s*$
          description: Integer or decimal string; value must be in [1, 4294967295].
        isbn:
          type: string
          nullable: true
          maxLength: 20
        publisher:
          type: string
          nullable: true
          maxLength: 200
        publish_year:
          oneOf:
          - type: integer
            nullable: true
            minimum: 1000
          - type: string
            pattern: ^\s*[0-9]*\s*$
          description: 'Null or empty string clears the year. Otherwise: 1000 through current Vietnam year + 1.'
        description:
          type: string
          nullable: true
          maxLength: 5000
        cover_path:
          type: string
          nullable: true
          enum:
          - null
          - ''
          - assets/images/covers/ai-intro.svg
          - assets/images/covers/algorithms.svg
          - assets/images/covers/clean-code.svg
          - assets/images/covers/database.svg
          - assets/images/covers/de-men.svg
          - assets/images/covers/default-book.svg
          - assets/images/covers/default.svg
          - assets/images/covers/history.svg
          - assets/images/covers/literature.svg
          - assets/images/covers/mat-biec.svg
          - assets/images/covers/networks.svg
          - assets/images/covers/nha-gia-kim.svg
          - assets/images/covers/rest-api.svg
          - assets/images/covers/sapiens.svg
          - assets/images/covers/thinking-fast-slow.svg
          - assets/images/covers/web-php-mysql.svg
        total_copies:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 10000
          - type: string
            pattern: ^\s*[0-9]+\s*$
          description: Integer or decimal string; value must be in [0, 10000].
        is_active:
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: boolean
          - type: string
            enum:
            - '0'
            - '1'
            - 'false'
            - 'true'
          default: 1
      required:
      - title
      - author
      - category_id
      - total_copies
    BookUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 200
        category_id:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 4294967295
          - type: string
            pattern: ^\s*[0-9]+\s*$
          description: Integer or decimal string; value must be in [1, 4294967295].
        isbn:
          type: string
          nullable: true
          maxLength: 20
        publisher:
          type: string
          nullable: true
          maxLength: 200
        publish_year:
          oneOf:
          - type: integer
            nullable: true
            minimum: 1000
          - type: string
            pattern: ^\s*[0-9]*\s*$
          description: 'Null or empty string clears the year. Otherwise: 1000 through current Vietnam year + 1.'
        description:
          type: string
          nullable: true
          maxLength: 5000
        cover_path:
          type: string
          nullable: true
          enum:
          - null
          - ''
          - assets/images/covers/ai-intro.svg
          - assets/images/covers/algorithms.svg
          - assets/images/covers/clean-code.svg
          - assets/images/covers/database.svg
          - assets/images/covers/de-men.svg
          - assets/images/covers/default-book.svg
          - assets/images/covers/default.svg
          - assets/images/covers/history.svg
          - assets/images/covers/literature.svg
          - assets/images/covers/mat-biec.svg
          - assets/images/covers/networks.svg
          - assets/images/covers/nha-gia-kim.svg
          - assets/images/covers/rest-api.svg
          - assets/images/covers/sapiens.svg
          - assets/images/covers/thinking-fast-slow.svg
          - assets/images/covers/web-php-mysql.svg
        total_copies:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 10000
          - type: string
            pattern: ^\s*[0-9]+\s*$
          description: Integer or decimal string; value must be in [0, 10000].
        is_active:
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: boolean
          - type: string
            enum:
            - '0'
            - '1'
            - 'false'
            - 'true'
          default: 1
    BookCollection:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                minimum: 1
              name:
                type: string
              description:
                type: string
                nullable: true
            required:
            - id
            - name
            - description
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
      required:
      - categories
      - books
    SystemSummary:
      type: object
      properties:
        total_book_titles:
          type: integer
          minimum: 0
        active_book_titles:
          type: integer
          minimum: 0
        inactive_book_titles:
          type: integer
          minimum: 0
        total_categories:
          type: integer
          minimum: 0
        total_copies:
          type: integer
          minimum: 0
        available_copies:
          type: integer
          minimum: 0
        borrowed_copies:
          type: integer
          minimum: 0
        total_members:
          type: integer
          minimum: 0
        active_members:
          type: integer
          minimum: 0
        locked_members:
          type: integer
          minimum: 0
        overdue_loans:
          type: integer
          minimum: 0
        total_titles:
          type: integer
          minimum: 0
        active_titles:
          type: integer
          minimum: 0
        pending_loans:
          type: integer
          minimum: 0
        borrowed_loans:
          type: integer
          minimum: 0
        returned_loans:
          type: integer
          minimum: 0
        loans_by_status:
          type: object
          properties:
            pending:
              type: integer
              minimum: 0
            borrowed:
              type: integer
              minimum: 0
            returned:
              type: integer
              minimum: 0
            rejected:
              type: integer
              minimum: 0
            cancelled:
              type: integer
              minimum: 0
          required:
          - pending
          - borrowed
          - returned
          - rejected
          - cancelled
      required:
      - total_book_titles
      - active_book_titles
      - inactive_book_titles
      - total_categories
      - total_copies
      - available_copies
      - borrowed_copies
      - total_members
      - active_members
      - locked_members
      - overdue_loans
      - total_titles
      - active_titles
      - pending_loans
      - borrowed_loans
      - returned_loans
      - loans_by_status
    TopBook:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
        book_id:
          type: integer
          minimum: 0
        total_copies:
          type: integer
          minimum: 0
        available_copies:
          type: integer
          minimum: 0
        loan_count:
          type: integer
          minimum: 0
        total_loans:
          type: integer
          minimum: 0
        currently_borrowed:
          type: integer
          minimum: 0
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
          nullable: true
        category_name:
          type: string
      required:
      - id
      - book_id
      - total_copies
      - available_copies
      - loan_count
      - total_loans
      - currently_borrowed
      - title
      - author
      - isbn
      - category_name
    OverdueLoan:
      type: object
      properties:
        loan_id:
          type: integer
          minimum: 1
        user_id:
          type: integer
          minimum: 1
        book_id:
          type: integer
          minimum: 1
        borrower_name:
          type: string
        borrower_email:
          type: string
        book_title:
          type: string
        book_isbn:
          type: string
          nullable: true
        borrowed_at:
          type: string
          nullable: true
        due_date:
          type: string
          format: date
        days_overdue:
          type: integer
          minimum: 1
      required:
      - loan_id
      - user_id
      - book_id
      - borrower_name
      - borrower_email
      - book_title
      - book_isbn
      - borrowed_at
      - due_date
      - days_overdue
    CategoryStatistics:
      type: object
      properties:
        category_id:
          type: integer
          minimum: 1
        category_name:
          type: string
        total_titles:
          type: integer
          minimum: 0
        total_copies:
          type: integer
          minimum: 0
        available_copies:
          type: integer
          minimum: 0
      required:
      - category_id
      - category_name
      - total_titles
      - total_copies
      - available_copies
    Statistics:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/SystemSummary'
        top_books:
          type: array
          items:
            $ref: '#/components/schemas/TopBook'
        most_borrowed_books:
          type: array
          items:
            $ref: '#/components/schemas/TopBook'
        overdue_list:
          type: array
          items:
            $ref: '#/components/schemas/OverdueLoan'
        categories_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/CategoryStatistics'
      required:
      - summary
      - top_books
      - most_borrowed_books
      - overdue_list
      - categories_breakdown
    Health:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        db_status:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - service
      - version
      - db_status
      - timestamp
paths:
  /auth/register:
    post:
      summary: Đăng ký Member; role/is_active do máy chủ đặt
      tags:
      - Auth
      responses:
        '201':
          description: Đã tạo tài khoản; không trả password/hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/RegisteredUser'
                  message:
                    type: string
                required:
                - success
                - data
                - message
          headers:
            Location:
              schema:
                type: string
              description: URI of the created resource; under /api/v1/.
        '400':
          description: 'INVALID_JSON: JSON sai cú pháp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not supported. See Allow header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              schema:
                type: string
              description: Comma-separated methods supported by this resource.
        '409':
          description: Xung đột dữ liệu hoặc chuyển trạng thái không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 'Phải gửi Content-Type: application/json.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'VALIDATION_ERROR: sai dữ liệu hoặc bộ lọc.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi máy chủ; không trả SQL hay khóa JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 150
                password:
                  type: string
                  minLength: 8
                  description: Không trim; tối đa 72 byte UTF-8, không có byte NUL.
              required:
              - full_name
              - email
              - password
      operationId: post_auth_register
    options:
      summary: CORS preflight.
      operationId: options_auth_register
      responses:
        '204':
          description: Preflight accepted; no response body.
  /auth/login:
    post:
      summary: Đăng nhập và cấp JWT HS256, thời hạn 15 phút
      tags:
      - Auth
      responses:
        '200':
          description: Token và tài khoản hiện tại.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Token'
                  message:
                    type: string
                required:
                - success
                - data
                - message
        '400':
          description: 'INVALID_JSON: JSON sai cú pháp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu JWT, JWT sai/hết hạn hoặc tài khoản không còn hoạt động.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer challenge.
